name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - run: npm run build
        env:
          # Build only needs a syntactically valid URL; the real one is set at deploy time.
          VITE_CONVEX_URL: https://example.convex.cloud
      - run: npm audit --audit-level=high --omit=dev
